name: Deploy Demo to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Build WASM demo package
        run: |
          cd demo-wasm
          wasm-pack build --target web --release

      - name: Assemble Pages artifact
        run: |
          mkdir -p site
          cp -r demo-wasm/www/* site/
          mkdir -p site/pkg
          cp -r demo-wasm/pkg/* site/pkg/

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: ${{ secrets.PAGES_ADMIN_TOKEN == '' }}
        with:
          enablement: ${{ secrets.PAGES_ADMIN_TOKEN != '' }}
          token: ${{ secrets.PAGES_ADMIN_TOKEN != '' && secrets.PAGES_ADMIN_TOKEN || github.token }}

      - name: Validate Pages setup
        if: ${{ steps.pages.outcome == 'failure' && secrets.PAGES_ADMIN_TOKEN == '' }}
        run: |
          echo "::error::GitHub Pages is not enabled for this repository."
          echo "::error::Enable it in Settings > Pages (Source: GitHub Actions), or add a PAGES_ADMIN_TOKEN secret with repository admin access."
          exit 1

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
